<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to PDF</title>
    <meta name="description"
        content="Convert text to a clean PDF in any language — Bengali (বাংলা), Hindi, Arabic, Chinese and more. Runs entirely in your browser.">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 7h9l5 5v13a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z' fill='%23fff'/%3E%3Cpath d='M12 16h8M12 19.5h8M12 23h5' stroke='%234f46e5' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="ocr.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                    <path d="M14 3v5h5M9 13h6M9 17h4" />
                </svg>
            </span>
            <h1>Text to PDF</h1>
        </div>
        <div class="author">
            <img src="hero-banner.jpg" alt="Suman" width="30" height="30">
            <span>by <strong>Suman</strong></span>
        </div>
    </header>

    <main class="workspace">
        <section class="card editor" aria-label="Editor">
            <input type="text" id="docTitle" class="title-input" placeholder="Title (optional)"
                aria-label="Document title" maxlength="200" autocomplete="off">

            <div class="controls">
                <label class="control control-font">
                    <span>Font</span>
                    <select id="fontFamily">
                        <option value="noto-sans">Noto Sans</option>
                        <option value="noto-serif">Noto Serif</option>
                        <option value="hind-siliguri">Hind Siliguri</option>
                        <option value="noto-serif-bengali">Noto Serif Bengali</option>
                        <option value="tiro-bangla">Tiro Bangla</option>
                    </select>
                </label>
                <label class="control">
                    <span>Size</span>
                    <select id="fontSize">
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="14">14</option>
                        <option value="16">16</option>
                        <option value="18">18</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                    </select>
                </label>
                <label class="control">
                    <span>Spacing</span>
                    <select id="lineHeight">
                        <option value="1.15">1.15</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2.0</option>
                    </select>
                </label>
                <label class="control">
                    <span>Page</span>
                    <select id="pageSize">
                        <option value="a4">A4</option>
                        <option value="letter">Letter</option>
                    </select>
                </label>
            </div>

            <div class="textarea-wrap" id="dropZone">
                <textarea id="textInput" spellcheck="true" aria-label="Text to convert"
                    placeholder="Type or paste your text here…&#10;এখানে আপনার লেখা টাইপ বা পেস্ট করুন…"></textarea>
                <div class="drop-hint" aria-hidden="true">Drop an image or text file</div>
                <div class="ocr-status" id="ocrStatus" hidden>
                    <div class="ocr-card" role="status" aria-live="polite">
                        <span class="spinner" aria-hidden="true"></span>
                        <strong id="ocrLabel">Reading text from image…</strong>
                        <div class="progress"><span id="ocrBar"></span></div>
                        <small id="ocrDetail">English &amp; Bengali</small>
                        <button type="button" class="link-btn" id="ocrCancel">Cancel</button>
                    </div>
                </div>
            </div>

            <div class="editor-foot">
                <div class="foot-left">
                    <label class="btn btn-ghost" title="Open an image (photo, scan, screenshot) or a text file">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5M12 3v12M7 8l5-5 5 5" />
                        </svg>
                        <span>Open</span>
                        <input type="file" id="fileInput" accept="image/*,.txt,.md,text/plain" multiple hidden>
                    </label>
                    <button type="button" class="btn btn-ghost" id="pasteBtn"
                        title="Paste an image or text from the clipboard (Ctrl+V works too)">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 4h6v3H9zM9 5.5H6.5a1.5 1.5 0 0 0-1.5 1.5v12.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V7a1.5 1.5 0 0 0-1.5-1.5H15M9 12h6M9 16h4" />
                        </svg>
                        <span>Paste</span>
                    </button>
                    <span class="stats" id="stats" aria-live="polite">0 words</span>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-secondary" id="shareBtn" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14" />
                        </svg>
                        <span class="btn-label">Share</span>
                    </button>
                    <button type="button" class="btn btn-primary" id="downloadBtn">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v12M7 10l5 5 5-5M4 19h16" />
                        </svg>
                        <span class="btn-label">Download PDF</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="card preview" aria-labelledby="preview-heading">
            <div class="preview-head">
                <h2 id="preview-heading">Preview</h2>
                <span class="badge" id="pageBadge">1 page</span>
            </div>
            <div class="preview-scroll" id="previewScroll">
                <div class="pages" id="pages"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>Made by Suman</span>
        <span aria-hidden="true">·</span>
        <span>Visits on this device: <strong id="visit">0</strong></span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>

</html>
